services:
  postgres:
    image: postgres:16-alpine
    container_name: psf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psf_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-psf}
    ports:
      - "5432:5432"
    volumes:
      - psf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psf} -d ${POSTGRES_DB:-psf}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: psf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - psf-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  psf-postgres-data:
  psf-redis-data:
