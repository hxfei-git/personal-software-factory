id: ai-novelist
name: AI 小说助手
description: Web AI writing assistant for creating, reviewing, repairing and exporting novels. Commands are conservative local defaults and require manual verification before real worker execution.
repo:
  url: https://github.com/hxfei-git/ai-novelist.git
  default_branch: main
runtime:
  kind: web
  backend:
    language: python
    framework: manual-verification-required
  frontend:
    language: typescript
    framework: manual-verification-required
commands:
  install:
    - python -m venv .venv
    - . .venv/bin/activate && pip install -e .
    - npm --prefix web/frontend install
  test:
    - . .venv/bin/activate && pytest -q
  build:
    - npm --prefix web/frontend run build
  run_staging:
    - . .venv/bin/activate && ai-novelist web --host 127.0.0.1 --port 8000
urls:
  production: ""
  staging: ""
quality_gates:
  require_build: true
  require_unit_tests: true
  require_e2e_tests: true
  require_ai_qa: true
  require_pr_review: true
  require_human_production_approval: true
core_flows:
  - id: open_home
    name: 打开首页
    priority: P0
  - id: create_novel_project
    name: 新建小说项目
    priority: P0
  - id: generate_worldview
    name: 生成世界观
    priority: P0
  - id: generate_outline
    name: 生成大纲
    priority: P0
  - id: generate_chapter
    name: 生成章节
    priority: P0
  - id: review_chapter
    name: 自动审稿
    priority: P0
  - id: repair_chapter
    name: 修复章节
    priority: P0
  - id: export_novel
    name: 导出小说
    priority: P1
